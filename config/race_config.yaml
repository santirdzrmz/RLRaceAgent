# ============================================================================
# Training config for RaceAgentG06 (drone racing assignment, group 06)
#
# IMPORTANT: the key under "behaviors:" must match the "Behavior Name" field
# on the Behavior Parameters component of the DroneBaseG06 prefab.
# Set Behavior Name on the prefab to: RaceAgentG06
# ============================================================================
behaviors:
  RaceAgentG06:
    trainer_type: ppo

    hyperparameters:
      # Larger batch/buffer than the placeholder. With ~4-8 parallel agent
      # instances in the scene, buffer_size should be ~10x batch_size.
      batch_size: 1024
      buffer_size: 10240

      # Learning rate decays linearly to 0 over max_steps.
      learning_rate: 3.0e-4
      learning_rate_schedule: linear

      # Entropy coefficient. 5e-3 keeps healthy exploration; raise to 1e-2
      # if the agent gets stuck on local optima (e.g. always turning one way).
      beta: 5.0e-3
      beta_schedule: linear

      # PPO clipping. 0.2 is the standard.
      epsilon: 0.2
      epsilon_schedule: linear

      # GAE lambda. 0.95 gives slightly lower variance than 0.99 here.
      lambd: 0.95
      num_epoch: 3

    network_settings:
      # Normalize MUST be true for continuous-action racing - without it,
      # the velocity/distance observations destabilize PPO badly.
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # 5M steps is a reasonable budget for multi-track training.
    # Stage 1 (Nascar only) usually converges around 1-1.5M steps.
    max_steps: 5000000

    # ~6.4s of decisions at decision period 5 / 50Hz physics.
    time_horizon: 128

    # How often metrics are written to TensorBoard.
    summary_freq: 20000

    keep_checkpoints: 5
